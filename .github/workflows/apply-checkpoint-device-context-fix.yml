name: Apply checkpoint device-context fix

on:
  push:
    branches:
      - agent/checkpoint-reentrant-device-context
    paths:
      - .github/workflows/apply-checkpoint-device-context-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/checkpoint-reentrant-device-context
          fetch-depth: 0

      - name: Apply patch
        run: |
          git apply --check .agent/checkpoint-reentrant-device-context.patch
          git apply .agent/checkpoint-reentrant-device-context.patch

      - name: Sanity check
        run: python -m compileall -q torch/utils/checkpoint.py

      - name: Commit clean patch
        run: |
          rm .agent/checkpoint-reentrant-device-context.patch
          rm .github/workflows/apply-checkpoint-device-context-fix.yml
          git add torch/utils/checkpoint.py test/test_utils.py .agent/checkpoint-reentrant-device-context.patch .github/workflows/apply-checkpoint-device-context-fix.yml
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -m "Preserve device context in reentrant checkpoint"
          git push origin HEAD:agent/checkpoint-reentrant-device-context
